<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章標題 | AI Dev Docs</title>
    <!-- TEMPLATE：複製本檔建立新文章。請替換 <title>、分類、標題、摘要、目錄與內文，不得移除任何區塊。 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header (不變) -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white to-indigo-400 bg-clip-text text-transparent">AI Dev Docs</span>
            </a>
            <nav class="flex items-center space-x-6 text-sm font-medium text-slate-300">
                <a href="../index.html" class="hover:text-indigo-400 transition-colors">首頁</a>
                <a href="index.html" class="text-indigo-400 font-semibold">文章總覽</a>
                <a data-github href="https://github.com" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg border border-slate-700 transition-all flex items-center gap-2">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </nav>
        </div>
    </header>

    <!-- Article Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-10 space-y-8">
        
        <!-- Hero Header -->
        <div class="space-y-4 border-b border-slate-800 pb-8">
            <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    <i class="fa-solid fa-tag"></i> [分類名稱]
                </span>
                <span class="text-xs text-slate-400 font-mono">發布日期：2026-11-03</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white">[請填寫文章標題]</h1>
            <p class="text-slate-400 text-base leading-relaxed">
                [請填寫 1-2 句簡單的文章摘要說明]
            </p>
        </div>

        <!-- Table of Contents -->
        <div class="bg-slate-800/40 rounded-xl p-5 border border-slate-700/50">
            <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-list-ul text-indigo-400"></i> 本文目錄
            </h3>
            <ul class="space-y-2 text-sm text-slate-300">
                <li><a href="#section-1" class="hover:text-indigo-400 transition-colors">1. 大綱一</a></li>
            </ul>
        </div>

        <!-- Article Content -->
        <article class="space-y-8 text-slate-300 leading-relaxed">
            <section id="section-1" class="space-y-4">
                <h2 class="text-2xl font-bold text-white border-l-4 border-indigo-500 pl-3">1. 大綱一</h2>
                <p>文章內文內容...</p>
            </section>

            <!-- Key Takeaways Card -->
            <div class="bg-indigo-950/30 border border-indigo-500/30 rounded-xl p-6 space-y-3">
                <h3 class="text-base font-bold text-indigo-300 flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb"></i> 重點總結 (Key Takeaways)
                </h3>
                <ul class="list-disc list-inside text-sm text-slate-300 space-y-1.5">
                    <li>重點一...</li>
                </ul>
            </div>
        </article>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-8 text-center text-xs text-slate-400">
        <p>© 2026 AI Developer Docs. Last updated: 2026-11-03</p>
    </footer>

    <script src="../js/site.js"></script>
</body>
</html>
